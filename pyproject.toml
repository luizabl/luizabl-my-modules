[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luizabl-my-modules"
version = "1.18.0"
description = "Módulos utilitários reutilizáveis para projetos Python"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
pushbullet = ["pushbullet.py>=0.12.0"]
qt = ["PyQt5>=5.15.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["my_modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
